services:
  core-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core-service
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DB_PATH: /app/data/tare.sqlite
    volumes:
      - ../data:/app/data
    env_file:
      - path: ../.env
        required: false
