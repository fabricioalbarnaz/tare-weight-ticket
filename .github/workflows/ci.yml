name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run typecheck

      - run: npm run test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin-ui

      - name: Admin UI E2E smoke tests
        run: npm run test:e2e --workspace=@tare/admin-ui

      - name: Build core-service Docker image
        run: docker build -f docker/Dockerfile.core-service -t core-service:ci .
